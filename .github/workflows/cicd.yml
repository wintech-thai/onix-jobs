name: onix-jobs

on:
  push:
    branches: [ develop, main ]
    tags: ['v*.*.*']

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "onix-legacy-jobs" ]
    outputs:
      imageTag: ${{ steps.prep.outputs.version }}
      autoDeployEnv: ${{ steps.prep.outputs.deployEnv }}
      autoDeployBranch: ${{ steps.prep.outputs.autoDeployBranch }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: Prepare
      id: prep
      run: |
        DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{matrix.service}}
        GCR_IMAGE=asia-southeast1-docker.pkg.dev/its-artifact-commons/onix/${{matrix.service}}
        VERSION=latest
        GIT_HASH=$(git rev-parse --short "$GITHUB_SHA")
        ENV=dev
        DEPLOYMENT_BRANCH=development
        SERVICE=${{matrix.service}}

        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          ENV=prod
          DEPLOYMENT_BRANCH=production
        elif [[ $GITHUB_REF == refs/heads/* ]]; then
          BRANCH=$(echo ${GITHUB_REF#refs/heads/} | sed -r 's#/+#-#g')
          VERSION=$BRANCH-$GIT_HASH
        fi

        TAGS="${DOCKER_IMAGE}:${VERSION}"
        GCR_TAGS="${GCR_IMAGE}:${VERSION}"

        if [[ $VERSION =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
          MINOR=${VERSION%.*}
          MAJOR=${MINOR%.*}
          TAGS="$TAGS,${DOCKER_IMAGE}:${MINOR},${DOCKER_IMAGE}:${MAJOR},${DOCKER_IMAGE}:latest"
        elif [ "${{ github.event_name }}" = "push" ]; then
          TAGS="$TAGS,${DOCKER_IMAGE}:sha-${GITHUB_SHA::8}"
        fi

        DOCKERFILE=Dockerfile

        echo ::set-output name=tags::${TAGS}
        echo ::set-output name=gcr_tags::${GCR_TAGS}
        echo ::set-output name=version::${VERSION}
        echo ::set-output name=deployEnv::${ENV}
        echo ::set-output name=autoDeployBranch::${DEPLOYMENT_BRANCH}
        echo ::set-output name=dockerFile::${DOCKERFILE}

    - name: Discord notification start
      if: always()
      uses: tsickert/discord-webhook@v7.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_CICD_WEBHOOK }}
        embed-title: '🚀 CI/CD Build Started'
        embed-description: |
          Service: `${{ matrix.service }}`
          Version: `${{ steps.prep.outputs.version }}`
        embed-color: 16776960

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v0'
      with:
        credentials_json: '${{ secrets.GCR_KEY }}'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: GCR Authen
      run: |
        # Set up docker to authenticate
        # via gcloud command-line tool.
        gcloud auth configure-docker asia-southeast1-docker.pkg.dev

    - name: Build and push images
      uses: docker/build-push-action@v3
      with:
        file: ${{ steps.prep.outputs.dockerFile }}
        push: true
        load: false
        tags: ${{ steps.prep.outputs.tags }}
        build-args: BUILD_VERSION=${{ steps.prep.outputs.version }}

    - name: Discord notification success
      if: success()
      uses: tsickert/discord-webhook@v7.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_CICD_WEBHOOK }}
        embed-title: '✅ CI/CD Build Completed'
        embed-description: |
          Service: `${{ matrix.service }}`
          Version: `${{ steps.prep.outputs.version }}`
        embed-color: 5763719


  deploy:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

    - name: Discord notification start
      if: always()
      uses: tsickert/discord-webhook@v7.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_CICD_WEBHOOK }}
        embed-title: '🚀 CI/CD Deployment Started'
        embed-description: |
          Service: `onix-legacy-jobs`
          Version: `${{ needs.build.outputs.imageTag }}`
          Environment: `${{ needs.build.outputs.autoDeployEnv }}`
        embed-color: 16776960

    # Auto deploy
    - name: Deploy
      id: deployment
      run: |
        export ENVIRONMENT=${{ needs.build.outputs.autoDeployEnv }}
        export ARGOCD_BRANCH=${{ needs.build.outputs.autoDeployBranch }}
        export VALUE_FILE_DIR="values/onix-backup"
        export VALUE_FILE=${VALUE_FILE_DIR}/onix-backup-03-${ENVIRONMENT}-image-tag.yaml
        export IMAGE_TAG1=${{ needs.build.outputs.imageTag }}
        git config --global user.email "cicd-auto@wintech-thai.com"
        git config --global user.name "CICD"

        git clone "https://cicd-token:${GH_TOKEN}@github.com/wintech-thai/onix-argocd-apps.git" deployment
        cd deployment
        git checkout ${ARGOCD_BRANCH}
        cp ${VALUE_FILE_DIR}/onix-backup-02-image-tag-template.yaml ${VALUE_FILE}
        sed -i "s#<<image-tag>>#${IMAGE_TAG1}#g" ${VALUE_FILE}
        ls -lrt
        cat ${VALUE_FILE}

        #git add ${VALUE_FILE}; git commit --m "Update image tag by auto deploy script"; git push

    - name: Discord notification end
      if: always()
      uses: tsickert/discord-webhook@v7.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_CICD_WEBHOOK }}
        embed-title: '🚀 CI/CD Deployment Completed'
        embed-description: |
          Service: `onix-legacy-jobs`
          Version: `${{ needs.build.outputs.imageTag }}`
          Environment: `${{ needs.build.outputs.autoDeployEnv }}`
        embed-color: 5763719
